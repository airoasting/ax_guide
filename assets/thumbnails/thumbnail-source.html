<title>Thumbnail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #062018; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    background: radial-gradient(ellipse at 28% 30%, #0E3B2A 0%, #062018 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card {
    width: 1060px;
    height: 500px;
    border-radius: 40px;
    background: linear-gradient(135deg, #14523B 0%, #0E3B2A 58%, #062018 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.10),
      inset 0 -3px 0 rgba(0,0,0,0.30),
      0 40px 80px rgba(0,0,0,0.55);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 18% -5%, rgba(255,255,255,0.10) 0%, transparent 52%);
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px) 0 0 / 100% 56px,
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px) 0 0 / 56px 100%;
    -webkit-mask-image: radial-gradient(ellipse at 80% 100%, #000 0%, transparent 60%);
    mask-image: radial-gradient(ellipse at 80% 100%, #000 0%, transparent 60%);
    pointer-events: none;
  }
  .badge {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    border-radius: 999px;
    background: rgba(154, 123, 10, 0.14);
    border: 1px solid rgba(212, 175, 55, 0.40);
    color: #E9D27A;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.18em;
    margin-bottom: 30px;
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #E9D27A;
    box-shadow: 0 0 10px rgba(233, 210, 122, 0.8);
  }
  .eyebrow {
    position: relative;
    z-index: 1;
    color: rgba(255,255,255,0.62);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.34em;
    margin-bottom: 22px;
  }
  .title {
    position: relative;
    z-index: 1;
    color: #ffffff;
    font-size: 70px;
    font-weight: 900;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    margin-bottom: 30px;
    white-space: nowrap;
  }
  .title .accent { color: #E9D27A; }
  .subtitle {
    position: relative;
    z-index: 1;
    color: rgba(255,255,255,0.82);
    font-size: 25px;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .steps {
    position: absolute;
    bottom: 34px;
    left: 44px;
    display: flex;
    gap: 10px;
    z-index: 1;
  }
  .step {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: rgba(255,255,255,0.20);
    border: 1px solid rgba(255,255,255,0.28);
  }
  .step.on { background: #E9D27A; border-color: #E9D27A; box-shadow: 0 0 8px rgba(233,210,122,0.6); }
  .logo {
    position: absolute;
    bottom: 30px;
    right: 42px;
    color: rgba(255,255,255,0.26);
    font-size: 32px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 0.02em;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span>COMPANY BRAIN OS</div>
    <div class="eyebrow">AI ROASTING</div>
    <div class="title">비즈니스 리더를 위한 <span class="accent">AX</span> 가이드</div>
    <div class="subtitle">회사의 AI 전환을 진단부터 자동화까지 · 5단계 실전 가이드</div>
    <div class="steps">
      <span class="step on"></span>
      <span class="step on"></span>
      <span class="step on"></span>
      <span class="step on"></span>
      <span class="step on"></span>
    </div>
    <div class="logo">AI ROASTING</div>
  </div>
</body>
